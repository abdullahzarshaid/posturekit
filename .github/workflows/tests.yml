name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Use the workspace temp directory on Windows
        # The hosted Windows runner's profile has an 8.3 short name (RUNNER~1) in TEMP, so a
        # message that prints the resolved path and a test that expects the long path disagree.
        # The workspace temp directory has no short-name component.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=${{ runner.temp }}" >> $env:GITHUB_ENV
          "TEMP=${{ runner.temp }}" >> $env:GITHUB_ENV
      - name: Analyzer and rule suite (synthetic fixtures, no host contacted)
        run: python Code/Tests.py
      - name: Manifest verifier and offline demo tests
        run: python -m unittest discover -s tests -v
      - name: Offline demonstration end to end
        run: python examples/offline_demo.py
  powershell:
    name: Windows PowerShell 5.1 fixture suite
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Collector helper fixtures (no adapter, no netsh, no key)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Code\CollectorHelperTests.ps1
